name: skript-orm
version: '${version}'
main: io.github.heyhey123.skriptorm.SkriptOrm
description: 'Read and write database rows from Skript: describe a table once, then insert, read, update and delete with Skript syntax instead of SQL.'
author: heyhey123
api-version: '26.2'
depend:
    - Skript
softdepend:
    - SkBee
# Drivers are never shaded into the jar. Paper downloads these once, on the first start, into the
# server's `libraries/` directory and puts them on this plugin's classpath. The list is written by the
# build and names one driver per implementation the jar carries, so a server only ever downloads what it
# can use. The source is the server's Central mirror: `PAPER_DEFAULT_CENTRAL_REPOSITORY`, or the
# `org.bukkit.plugin.java.LibraryLoader.centralURL` system property, or Google's mirror of Central by
# default.
libraries:${libraries}
