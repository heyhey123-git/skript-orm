# Copied into the run directory by the `prepareServerTest` task.
#
# A disposable server that never accepts a player, so everything that only matters for a real
# server is off and startup stays short.
online-mode=false
server-port=25599
level-type=minecraft:flat
# The layers are stated because a flat level type without them makes the server log
# "No key layers in MapLike[{}]" at ERROR level while it creates the world, which reads like a
# failure in the run's log.
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-name=world
spawn-protection=0
max-players=1
view-distance=2
simulation-distance=2
difficulty=peaceful
enable-command-block=false
enable-status=false
sync-chunk-writes=false
