name: Benchmarks

# Performance work runs on its own schedule rather than in ci.yml, for two reasons: a benchmark takes
# minutes where a test takes seconds, and a benchmark answers "how fast" while a test answers "does it
# work". Mixing them would make the second answer wait for the first.
#
# Nothing here fails a run because a number moved, and the threshold below is not yet a gate.
#
# The band was measured on one machine on 2026-10-02, in two back-to-back runs of
# `./gradlew :benchmarks:jmh` with the settings this workflow uses — two forks, two warmup iterations,
# three measurement iterations, six samples each — and nothing else running:
#
#   InsertManyBenchmark.insertManyOf5000   run 1  12.447 ms/op +/- 4.407   run 2  10.049 ms/op +/- 1.201
#   RowLimitBenchmark.rowsPerStatement     run 1  11.708 ns/op +/- 3.691   run 2  11.236 ns/op +/- 0.241
#
# So on an idle machine the same tree moved 19 to 24 percent between runs for the insert case and 4 percent
# for the row-limit case, while JMH's own error inside a single run reached 35 percent of the score. Two
# things follow, and they are why `fail-on-alert` stays false. A threshold can only mean something above the
# noise: anything below roughly 50 percent here would fire on this machine rather than on the code, and the
# 150 percent below is above that band by a margin nobody measured — it is a placeholder, not a finding. And
# the noise is not one number: an I/O bound case measured in milliseconds and a CPU bound case measured in
# nanoseconds do not share a band, so a single threshold is the wrong instrument for this suite.
#
# Nor is a band measured on a developer machine the band a GitHub runner will show: a runner is a different
# CPU, with different neighbours on the host, and it has no history yet. The gate therefore stays off until
# `gh-pages` carries enough nightly runs to read the spread out of that history — set the threshold from that
# history first, and turn the gate on after it, in that order. What fails a run today is the harness itself: a
# benchmark that stops compiling, or a case that cannot run.
#
# And "a GitHub runner" is itself a pool rather than one machine: two attempts of this workflow on one commit
# with one set of settings landed on an AMD EPYC 9V74 and an Intel Xeon Platinum 8573C, and differed by 1.32
# times on the insert case and 1.21 times on the row-limit case — hardware only, and larger than the moves this
# suite exists to notice. A history that mixed the two would report the machine rather than the code, so each
# result is filed under a directory named for the CPU that produced it: see the slug in the environment step
# and `benchmark-data-dir-path` below. That does not turn the threshold into a finding; the band above is still
# one machine's, and the gate still stays off until the per-CPU histories are long enough to read a spread from.
on:
  # Every night, so the trend exists even in a week nobody touches the hot path. The minute is off the
  # hour because GitHub's scheduler is busiest then.
  schedule:
    - cron: '17 3 * * *'

  # A pull request that could move a number gets a run, so a regression is visible before it is merged
  # rather than after a release. The filter is the same ignore list ci.yml uses, for the reason it gives
  # there: forgetting a new build input in an allow list would silently stop the run for a real change,
  # while forgetting an inert file here only costs a run that was not needed.
  #
  # There is no `push` trigger. A pull request has already run on these commits, and the nightly below
  # covers the default branch, so a push trigger would only repeat what one of the two just did.
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'

  # Manual runs, because a trend is only useful if a suspicious night can be repeated on demand. The
  # filter is the same property a local run uses, so a single case can be checked in a minute.
  workflow_dispatch:
    inputs:
      forks:
        description: 'JMH forks per benchmark; more forks mean a wider estimate and a longer run.'
        required: false
        default: '2'
      filter:
        description: 'JMH benchmark name regex. Empty runs every case.'
        required: false
        default: ''

permissions:
  # The action keeps its history on the gh-pages branch: it pushes the new numbers there and reads the
  # old ones back. `contents: write` is also what lets a pull request be commented on by the same token.
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  jmh:
    name: JMH benchmarks
    runs-on: ubuntu-latest
    # Longer than any other job in this repository: a case costs its warmup and measurement iterations
    # in wall-clock time, and a suite of them costs minutes by arithmetic. The timeout is here so a
    # case that hangs is a failed run rather than a job that burns an hour.
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build
        with:
          # A pull request reads the shared cache but does not write it, which is the same rule the
          # Testcontainers jobs follow: what a branch writes is not what a later release builds from.
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}

      # A number without the machine it came from is not a number anyone can compare with another, which
      # is the baseline policy these runs exist to feed. Most of this is only knowable on the runner, so
      # it is written here rather than by the benchmark task, and it is uploaded beside the report.
      # The CPU line is read once and reused, because the same string decides where the numbers are filed:
      # `ubuntu-latest` is a pool, and a history that mixed an EPYC point with a Xeon one would be reporting
      # the machine rather than the code.
      - name: Record the environment
        id: environment
        run: |
          mkdir -p benchmarks/build/benchmarks
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "dirty=$(git status --porcelain | wc -l)"
            echo "os=$(uname -srm)"
            echo "cpu=$cpu"
            echo "cores=$(nproc)"
            echo "memory=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "java=$(java -version 2>&1 | head -n1)"
          } | tee benchmarks/build/benchmarks/environment.txt
          # The same model string reduced to something a directory can be named after:
          # "AMD EPYC 9V74 80-Core Processor" -> "amd-epyc-9v74-80-core-processor" and
          # "INTEL(R) XEON(R) PLATINUM 8573C" -> "intel-xeon-platinum-8573c". Truncated so a pathological
          # model string cannot become an unwieldy path, and defaulted so an unreadable /proc/cpuinfo files
          # the result under `unknown` rather than at the root of the history.
          slug=$(printf '%s' "$cpu" \
            | sed -E 's/\((R|TM|C)\)//g' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-64 \
            | sed -E 's/-+$//')
          [ -n "$slug" ] || slug=unknown
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> benchmarks/build/benchmarks/environment.txt

      - name: Run the benchmarks
        run: |
          ./gradlew :benchmarks:jmh --stacktrace \
            -Pbenchmarks.forks=${{ github.event.inputs.forks || '2' }} \
            ${{ github.event.inputs.filter && format('-Pbenchmarks.filter={0}', github.event.inputs.filter) || '' }}

      # A run's log scrolls away; the run's summary does not. The table is the same numbers the action
      # reads, written where a person deciding whether to look further will see them.
      - name: Summarise the report
        if: always()
        run: |
          report=benchmarks/build/benchmarks/results.json
          if [ ! -f "$report" ]; then
            echo "No report was written; the run above says why." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### JMH'
            echo
            echo '| benchmark | score | unit |'
            echo '| --- | --- | --- |'
            jq -r '.[] | "| \(.benchmark) | \((.primaryMetric.score * 1000 | round) / 1000) | \(.primaryMetric.scoreUnit) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jmh-report
          path: |
            benchmarks/build/benchmarks/results.json
            benchmarks/build/benchmarks/environment.txt
          if-no-files-found: ignore

      # The history lives on `gh-pages`, which exists and is created by hand rather than here: creating a
      # branch is a push, and a run that pushed its own storage into place would be writing outside the
      # change it was run for. It is kept per CPU — see `benchmark-data-dir-path` below.
      #
      # `tool: jmh` reads JMH's own JSON and nothing else, which is the reason the benchmark task writes
      # that format instead of a table of its own.
      - name: Record the numbers
        if: github.event_name == 'pull_request' && hashFiles('benchmarks/build/benchmarks/results.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'jmh'
          output-file-path: benchmarks/build/benchmarks/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          # One directory per CPU model, because the action compares each new number against whatever history
          # is at this path and `ubuntu-latest` is a pool: a Xeon run must not be read against an EPYC point.
          # The environment step above derives the slug from the same model string it writes into the record,
          # so the number and the machine that produced it stay filed together.
          benchmark-data-dir-path: 'dev/bench/${{ steps.environment.outputs.slug }}'
          # A pull request is compared against the history but never writes to it: the numbers a branch
          # produces are not the numbers the next branch should be measured against.
          auto-push: false
          # Commenting needs a token that may write to the pull request, which a pull request from a
          # fork does not get. Comparing still happens there; only the comment is skipped.
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The placeholder the note at the top of this file explains. The measured run-to-run move was 19 to
          # 24 percent for the I/O bound case and 4 percent for the CPU bound one, with JMH's within-run error
          # reaching 35 percent of the score, so a threshold that meant anything would have to clear roughly
          # 50 percent — and this one is not derived from CI history either way.
          alert-threshold: '150%'
          # Report only, deliberately: a band measured on one machine is not the band a runner will show, so
          # the gate stays off until there is CI history to measure it from. See the note at the top of this
          # file for the numbers and for what turning it on would take.
          fail-on-alert: false

  # Paper measures wall time and tick gaps on each database. Shared runners make these
  # readings useful as trends, not as a pass/fail gate.
  tick:
    name: Tick benchmark (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: SQLite
            type: JDBC
            image: none
            url: ''
            username: ''
            password: ''
          - backend: MySQL
            type: MySQL
            image: mysql:8.4
            url: jdbc:mysql://127.0.0.1:3306/skriptorm_bench
            username: benchmark
            password: benchmark
          - backend: MariaDB
            type: MariaDB
            image: mariadb:11.4
            url: jdbc:mariadb://127.0.0.1:3307/skriptorm_bench
            username: benchmark
            password: benchmark
          - backend: PostgreSQL
            type: PostgreSQL
            image: postgres:17
            url: jdbc:postgresql://127.0.0.1:5432/skriptorm_bench
            username: benchmark
            password: benchmark
          - backend: MongoDB
            type: MongoDB
            image: mongo:8
            url: 127.0.0.1:27017
            username: ''
            password: ''
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Start the database
        if: matrix.backend != 'SQLite'
        run: |
          case '${{ matrix.backend }}' in
            MySQL)
              docker run -d --name benchmark-db -p 3306:3306 \
                -e MYSQL_DATABASE=skriptorm_bench -e MYSQL_USER=benchmark \
                -e MYSQL_PASSWORD=benchmark -e MYSQL_ROOT_PASSWORD=benchmark_root \
                '${{ matrix.image }}'
              ;;
            MariaDB)
              docker run -d --name benchmark-db -p 3307:3306 \
                -e MARIADB_DATABASE=skriptorm_bench -e MARIADB_USER=benchmark \
                -e MARIADB_PASSWORD=benchmark -e MARIADB_ROOT_PASSWORD=benchmark_root \
                '${{ matrix.image }}'
              ;;
            PostgreSQL)
              docker run -d --name benchmark-db -p 5432:5432 \
                -e POSTGRES_DB=skriptorm_bench -e POSTGRES_USER=benchmark \
                -e POSTGRES_PASSWORD=benchmark '${{ matrix.image }}'
              ;;
            MongoDB)
              docker run -d --name benchmark-db -p 27017:27017 '${{ matrix.image }}'
              ;;
          esac

          for attempt in {1..60}; do
            case '${{ matrix.backend }}' in
              MySQL)
                docker exec benchmark-db mysql -ubenchmark -pbenchmark skriptorm_bench \
                  -e 'SELECT 1' >/dev/null 2>&1 && break
                ;;
              MariaDB)
                docker exec benchmark-db mariadb -ubenchmark -pbenchmark skriptorm_bench \
                  -e 'SELECT 1' >/dev/null 2>&1 && break
                ;;
              PostgreSQL)
                docker exec benchmark-db psql -U benchmark -d skriptorm_bench \
                  -Atqc 'SELECT 1' >/dev/null 2>&1 && break
                ;;
              MongoDB)
                docker exec benchmark-db mongosh --quiet \
                  --eval 'if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)' \
                  >/dev/null 2>&1 && break
                ;;
            esac
            if [ "$attempt" -eq 60 ]; then
              docker logs benchmark-db
              echo '${{ matrix.backend }} did not become ready within 60 seconds.' >&2
              exit 1
            fi
            sleep 1
          done

      # Keep each result with the machine and database that produced it.
      - name: Record the environment
        id: environment
        run: |
          mkdir -p build/benchmarks
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "dirty=$(git status --porcelain | wc -l)"
            echo "os=$(uname -srm)"
            echo "cpu=$cpu"
            echo "cores=$(nproc)"
            echo "memory=$(free -h | awk '/^Mem:/ {print $2}')"
            echo "java=$(java -version 2>&1 | head -n1)"
            echo "backend=${{ matrix.backend }}"
            echo "database_image=${{ matrix.image }}"
          } | tee build/benchmarks/environment.txt
          slug=$(printf '%s' "$cpu" \
            | sed -E 's/\((R|TM|C)\)//g' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-64 \
            | sed -E 's/-+$//')
          [ -n "$slug" ] || slug=unknown
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> build/benchmarks/environment.txt

      - name: Run the tick benchmark
        run: |
          args=("-Pskriptorm.benchmark.server.type=${{ matrix.type }}")
          if [ -n '${{ matrix.url }}' ]; then
            args+=('-Pskriptorm.benchmark.url=${{ matrix.url }}')
          fi
          if [ -n '${{ matrix.username }}' ]; then
            args+=(
              '-Pskriptorm.benchmark.username=${{ matrix.username }}'
              '-Pskriptorm.benchmark.password=${{ matrix.password }}'
            )
          fi
          ./gradlew serverBenchmark --stacktrace "${args[@]}"

      # Print each reading with its runner and database for log searches.
      - name: Print the numbers with their machine
        if: always()
        run: |
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')
          os=$(uname -srm)
          cores=$(nproc)
          java=$(java -version 2>&1 | head -n1)
          commit=$(git rev-parse HEAD)
          echo "[tick] measurement: backend=${{ matrix.backend }} image=${{ matrix.image }} os=$os cpu=$cpu cores=$cores java=$java commit=$commit"
          if [ -f build/benchmarks/tick-results.json ]; then
            jq -r --arg os "$os" --arg cpu "$cpu" --arg cores "$cores" --arg java "$java" --arg commit "$commit" \
              --arg backend '${{ matrix.backend }}' --arg image '${{ matrix.image }}' \
              '.[] | "[tick] \(.name)=\(.value)\(.unit) backend=\($backend) image=\($image) os=\($os) cpu=\($cpu) cores=\($cores) java=\($java) commit=\($commit)"' \
              build/benchmarks/tick-results.json
          fi

      # Put the report in the run summary for quick inspection.
      - name: Summarise the report
        if: always()
        run: |
          report=build/benchmarks/tick-results.json
          if [ ! -f "$report" ]; then
            echo "No tick report was written; the run above says why." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Tick: ${{ matrix.backend }}'
            echo
            echo '| measurement | value | unit |'
            echo '| --- | --- | --- |'
            jq -r '.[] | "| \(.name) | \(.value) | \(.unit) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tick-report-${{ matrix.backend }}
          path: |
            build/benchmarks/tick-results.json
            build/benchmarks/pipeline-results.json
            build/benchmarks/environment.txt
          if-no-files-found: ignore

      # Separate trends by CPU and database; shorter tick costs are better.
      - name: Record the numbers
        if: github.event_name == 'pull_request' && hashFiles('build/benchmarks/tick-results.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/benchmarks/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.environment.outputs.slug }}/tick-ns/${{ matrix.backend }}'
          auto-push: false
          comment-on-alert: false
          fail-on-alert: false

  publish:
    name: Publish benchmark history
    if: github.event_name != 'pull_request'
    needs: [jmh, tick]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download the reports
        uses: actions/download-artifact@v6
        with:
          pattern: '*-report*'
          path: build/published-benchmarks

      - name: Read CPU slugs
        id: slugs
        run: |
          for entry in \
            'jmh:jmh-report' \
            'sqlite:tick-report-SQLite' \
            'mysql:tick-report-MySQL' \
            'mariadb:tick-report-MariaDB' \
            'postgresql:tick-report-PostgreSQL' \
            'mongodb:tick-report-MongoDB'; do
            key=${entry%%:*}
            artifact=${entry#*:}
            environment="build/published-benchmarks/$artifact/environment.txt"
            slug=$(sed -n 's/^slug=//p' "$environment" | tail -n1)
            if [ -z "$slug" ]; then
              echo "Missing CPU slug in $environment" >&2
              exit 1
            fi
            echo "$key=$slug" >> "$GITHUB_OUTPUT"
          done

      # Publish sequentially so matrix jobs cannot push over each other's history.
      - name: Publish JMH history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'jmh'
          output-file-path: build/published-benchmarks/jmh-report/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.jmh }}'
          auto-push: true
          comment-on-alert: false
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Publish SQLite tick history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/published-benchmarks/tick-report-SQLite/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.sqlite }}/tick-ns/SQLite'
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish MySQL tick history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/published-benchmarks/tick-report-MySQL/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.mysql }}/tick-ns/MySQL'
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish MariaDB tick history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/published-benchmarks/tick-report-MariaDB/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.mariadb }}/tick-ns/MariaDB'
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish PostgreSQL tick history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/published-benchmarks/tick-report-PostgreSQL/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.postgresql }}/tick-ns/PostgreSQL'
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish MongoDB tick history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: build/published-benchmarks/tick-report-MongoDB/tick-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench/${{ steps.slugs.outputs.mongodb }}/tick-ns/MongoDB'
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false
