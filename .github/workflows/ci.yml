name: CI

on:
  push:
    # Branch pushes only. release.yml tags the commit it built and tested, so a tag needs no run of
    # its own; without this filter every release would repeat the whole workflow on that tag.
    branches:
      - '**'
    # A documentation or IDE-only change cannot affect the build, and skipping it saves a container
    # pull and two database runs. This is deliberately an ignore list rather than an allow list:
    # forgetting a new build input in an allow list would silently stop CI from running for a real
    # change, while forgetting an inert file here only costs a run that was not needed.
    #
    # `.editorconfig` is absent on purpose. It looks inert but ktlint reads it, so a change there
    # changes what the formatting check accepts.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
  # Manual runs ignore the filters, so CI can always be forced.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Everything that needs no database. This is the job a pull request should be able to rely on.
  test:
    name: Unit and Skript tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Restores the Gradle User Home: the wrapper distribution, every resolved dependency, and the
      # API jars Gradle generates on first use. This is what stops a run from repeating the
      # installation. See the continuous integration section of CONTRIBUTION.md for what is
      # deliberately not cached.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      # The wrapper is committed from Windows, where the executable bit is not tracked, so it may
      # arrive without it.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit and Skript tests
        run: ./gradlew :core:test :core:integrationTest :generic-jdbc-implementation:test --stacktrace

      # Reading a job log through the API needs admin rights, while annotations are public, so every
      # failing test is reported as an annotation as well.
      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      - name: Check formatting
        run: ./gradlew ktlintCheck --stacktrace

  # The JDBC integration tests against the MySQL the runner image already installs. Starting that
  # server costs no image pull at all, and it puts the version the image ships (8.0 today) next to
  # the 8.4 the Testcontainers job pins, so the suite covers two servers for one pull.
  mysql-installed:
    name: JDBC tests against the runner's MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # The image installs MySQL and leaves it stopped. The loop waits for the server to accept a
      # connection; the last command needs working credentials, so the step fails if they do not.
      # `-h 127.0.0.1` is deliberate: a bare `mysql` would use the unix socket and hide a broken
      # TCP listener, which is the path the driver takes.
      - name: Start the installed MySQL
        run: |
          sudo systemctl start mysql.service
          for attempt in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION()'

      - name: Create the test database
        run: mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS xiaojie_orm_test'

      # The properties are passed instead of the environment so the test JVM cannot miss them, and so
      # Testcontainers is not consulted at all.
      - name: Run the JDBC integration tests
        run: |
          ./gradlew :generic-jdbc-implementation:integrationTest --stacktrace \
            -Pxiaojie.test.mysql.url="jdbc:mysql://127.0.0.1:3306/xiaojie_orm_test" \
            -Pxiaojie.test.mysql.username=root \
            -Pxiaojie.test.mysql.password=root

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      # The same server and the same database, now with the Skript layer pointed at it: the element
      # scripts run against a live connection and a round trip checks that a row a script wrote comes
      # back. This is the only place the value conversions in `values` and `where` are exercised,
      # because they happen after the database lookup.
      - name: Run the Skript server test against the same server
        run: |
          ./gradlew serverTest --stacktrace \
            -Pxiaojie.test.mysql.url="jdbc:mysql://127.0.0.1:3306/xiaojie_orm_test" \
            -Pxiaojie.test.mysql.username=root \
            -Pxiaojie.test.mysql.password=root

      # The same as the other job's step: the harness writes its problems beside the log, and this
      # turns them, plus anything the server itself complained about, into annotations.
      - name: Annotate the server test
        if: failure()
        run: |
          problems=build/server-test/logs/test-problems.txt
          if [ -f "$problems" ]; then
            # These already carry the evidence, and annotations are capped, so do not spend the
            # budget on the log as well.
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$problems"
            exit 0
          fi
          # No problems file means the harness never got to write one, so the server itself is what
          # went wrong; fall back to whatever it complained about.
          log=build/server-test/logs/latest.log
          if [ -f "$log" ]; then
            grep -E 'XIAOJIE_SELFTEST|\[Skript\] Line|Exception|ERROR' "$log" | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-installed-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-installed-server-log
          # The whole directory, so the harness's problem list travels with the log.
          path: build/server-test/logs/
          if-no-files-found: ignore

  # The same tests through the path a developer uses locally: no external server configured, so the
  # suite starts its own container. This is what proves the Docker detection and image pinning work.
  #
  # This is the only job whose cost cannot be cached at all: GitHub cannot cache Docker images, so it
  # always pulls mysql:8.4. It is therefore restricted to the default branch and to manual runs,
  # which keeps pull requests to a single image pull instead of two.
  mysql-testcontainers:
    name: JDBC tests through Testcontainers
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Read-only: this job resolves the same dependencies as the job above, so restoring is enough
      # and there is no reason to spend cache budget writing a second entry.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Run the JDBC integration tests
        run: ./gradlew :generic-jdbc-implementation:integrationTest --stacktrace

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-testcontainers-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Boots a real Paper server carrying Skript and the built plugin, and checks what the addon did
  # there. It is the only layer that can see element registration and the parse phase of a real
  # script, and it needs nothing from the runner image: no Docker, no database.
  #
  # Writing eula.txt is what the run directory the job creates contains; accepting the Minecraft EULA
  # for a disposable test server is a decision recorded in build.gradle.kts.
  skript-server:
    name: Tests on a real Paper server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      # The Paper jar run-paper downloads lands under the Gradle user home, which the step above
      # already caches in full, so there is nothing to cache here separately.

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Run the Skript server test
        run: ./gradlew serverTest --stacktrace

      # A failing step's log needs admin rights to read, while annotations are public. The harness
      # writes its own problems to a file for exactly this reason; the server log is added for the
      # cases where the server, rather than an assertion, is what went wrong.
      - name: Annotate the server test
        if: failure()
        run: |
          problems=build/server-test/logs/test-problems.txt
          if [ -f "$problems" ]; then
            # These already carry the evidence, and annotations are capped, so do not spend the
            # budget on the log as well.
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$problems"
            exit 0
          fi
          # No problems file means the harness never got to write one, so the server itself is what
          # went wrong; fall back to whatever it complained about.
          log=build/server-test/logs/latest.log
          if [ -f "$log" ]; then
            grep -E 'XIAOJIE_SELFTEST|\[Skript\] Line|Exception|ERROR' "$log" | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: skript-server-log
          # The whole directory, so the harness's problem list travels with the log.
          path: build/server-test/logs/
          if-no-files-found: ignore
