name: CI

on:
  push:
    # Release tags point to commits already tested by this workflow.
    branches:
      - '**'
    # Skip documentation and IDE-only changes. Keep `.editorconfig` in scope because ktlint reads it.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
  # Manual runs ignore the filters, so CI can always be forced.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Unit tests, Skript integration tests, and formatting checks that need no external database.
  test:
    name: Unit and Skript tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build

      - name: Run unit and Skript tests
        run: ./gradlew :core:test :core:integrationTest :generic-jdbc-implementation:test :mongodb-implementation:test --stacktrace

      # Surface test failures as annotations without requiring access to the full job log.
      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      - name: Check formatting
        run: ./gradlew ktlintCheck --stacktrace

  # Use the runner's installed MySQL for JDBC tests. MariaDB tests start their own container
  # because the runner does not provide a MariaDB server.
  mysql-installed:
    name: JDBC tests against the runner's MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build

      # Check TCP access with the same host and credentials used by the JDBC tests.
      - name: Start the installed MySQL
        run: |
          sudo systemctl start mysql.service
          for attempt in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e 'SELECT VERSION()'

      - name: Create the test database
        run: mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS skriptorm_test'

      # Pass connection properties to the test JVM so it uses this server instead of Testcontainers.
      - name: Run the JDBC integration tests
        run: |
          ./gradlew :generic-jdbc-implementation:integrationTest --stacktrace \
            -Pskriptorm.test.mysql.url="jdbc:mysql://127.0.0.1:3306/skriptorm_test" \
            -Pskriptorm.test.mysql.username=root \
            -Pskriptorm.test.mysql.password=root

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      # Run the Skript element tests against the same database, including value conversion paths.
      - name: Run the Skript server test against the same server
        run: |
          ./gradlew serverTest --stacktrace \
            -Pskriptorm.test.mysql.url="jdbc:mysql://127.0.0.1:3306/skriptorm_test" \
            -Pskriptorm.test.mysql.username=root \
            -Pskriptorm.test.mysql.password=root

      - name: Annotate the server test
        if: failure()
        uses: ./.github/actions/annotate-server-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-installed-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-installed-server-log
          # Include both the server log and the test harness's problem list.
          path: build/server-test/logs/
          if-no-files-found: ignore

  # Run PostgreSQL integration tests against the server installed on the runner.
  postgres-installed:
    name: PostgreSQL tests against the runner's server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build

      # Set the password used by JDBC, then wait for the TCP listener to accept connections.
      - name: Start the installed PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432
          sudo -u postgres createdb skriptorm_test
          sudo -u postgres psql -d skriptorm_test -c 'SELECT version()'

      # Pass connection properties to the test JVM so it uses this server instead of Testcontainers.
      - name: Run the PostgreSQL integration tests
        run: |
          ./gradlew :postgresql-implementation:integrationTest --stacktrace \
            -Pskriptorm.test.postgres.url="jdbc:postgresql://127.0.0.1:5432/skriptorm_test" \
            -Pskriptorm.test.postgres.username=postgres \
            -Pskriptorm.test.postgres.password=postgres

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      # Run the Skript suite against PostgreSQL, including named connections and transactions.
      # This also checks that Paper resolves the JDBC driver declared in plugin.yml.
      - name: Run the Skript server test against the same server
        run: |
          ./gradlew serverTest --stacktrace \
            -Pskriptorm.test.server.type=PostgreSQL \
            -Pskriptorm.test.postgres.url="jdbc:postgresql://127.0.0.1:5432/skriptorm_test" \
            -Pskriptorm.test.postgres.username=postgres \
            -Pskriptorm.test.postgres.password=postgres

      - name: Annotate the server test
        if: failure()
        uses: ./.github/actions/annotate-server-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-server-log
          # Include both the server log and the test harness's problem list.
          path: build/server-test/logs/
          if-no-files-found: ignore

  # Run both MySQL and MariaDB through Testcontainers when no external server is configured.
  # Container image pulls are limited to default-branch and manual runs.
  mysql-testcontainers:
    name: JDBC tests through Testcontainers
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build
        with:
          gradle-cache-read-only: true

      - name: Run the JDBC integration tests
        run: ./gradlew :generic-jdbc-implementation:integrationTest --stacktrace

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-testcontainers-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Exercise MongoDB filters, conversions, and counts against a real server through Testcontainers.
  # Limit image pulls to default-branch and manual runs.
  mongo-testcontainers:
    name: MongoDB tests through Testcontainers
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build
        with:
          gradle-cache-read-only: true

      - name: Run the MongoDB integration tests
        run: ./gradlew :mongodb-implementation:integrationTest --stacktrace

      - name: Annotate failing tests
        if: failure()
        uses: ./.github/actions/annotate-test-failures

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mongo-testcontainers-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Run the Skript server suite against MongoDB. A service container provides an address for the
  # Paper process before it starts; the suite also checks the unsupported-transaction response.
  mongo-server:
    name: Skript server test against MongoDB
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build
        with:
          gradle-cache-read-only: true

      # Wait for MongoDB to answer before starting the Skript server test.
      - name: Wait for MongoDB
        run: |
          for attempt in $(seq 1 30); do
            if docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval 'db.runCommand({ ping: 1 })'

      # Use the service container's published host port, which Paper can reach.
      - name: Run the Skript server test against MongoDB
        run: |
          ./gradlew serverTest --stacktrace \
            -Pskriptorm.test.server.type=MongoDB \
            -Pskriptorm.test.mongo.url=127.0.0.1:27017

      - name: Annotate the server test
        if: failure()
        uses: ./.github/actions/annotate-server-test

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mongo-server-log
          # Include both the server log and the test harness's problem list.
          path: build/server-test/logs/
          if-no-files-found: ignore

  # Check element registration and script parsing on a disposable Paper server without an external
  # database. The server setup and EULA acceptance are defined in build.gradle.kts.
  skript-server:
    name: Tests on a real Paper server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # The shared Gradle cache includes the downloaded Paper jar.
      - uses: ./.github/actions/prepare-build

      - name: Run the Skript server test
        run: ./gradlew serverTest --stacktrace

      - name: Annotate the server test
        if: failure()
        uses: ./.github/actions/annotate-server-test

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: skript-server-log
          # Include both the server log and the test harness's problem list.
          path: build/server-test/logs/
          if-no-files-found: ignore
