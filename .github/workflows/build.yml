name: Build

# Every push produces a downloadable plugin jar, so testers can pick up the current state of the code
# without waiting for a release. Correctness is ci.yml's business; this workflow only packages, and
# its artifact is a snapshot rather than a promise.
on:
  push:
    # Branch pushes only: a release tag is the same commit, already built and verified by release.yml,
    # so building it again would only produce a second artifact nobody asks for.
    branches:
      - '**'
    # The same inert changes ci.yml ignores: neither can change what gets built.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
  # Manual runs ignore the filters, so a build can always be produced for a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Package the plugin jar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # The version comes from the same file the build reads, so the artifact name and the jar name
      # cannot disagree with what the build actually produced.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::gradle.properties declares no version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build the shaded jar
        run: ./gradlew shadowJar --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v6
        with:
          name: skriptorm-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: build/dist/*.jar
          # A build that produced no jar is a failure, not an empty artifact.
          if-no-files-found: error

      - name: Summarize
        run: |
          {
            echo "### Build \`${{ steps.version.outputs.version }}\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Jar | \`$(basename build/dist/*.jar)\` |"
            echo
            echo "Download it from the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
