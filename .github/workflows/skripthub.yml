name: SkriptHub docs

# Publish generated syntax to SkriptHub after a release. Examples still use the dashboard's JSON import.
#
# The Release workflow uses the repository token, so its published-release event cannot start
# another workflow. Its completion event provides the commit to build here. Release runs are
# restricted to the default branch before this job receives the SkriptHub secret.
#
# Publication failure does not block the release; SkriptHub can be updated by rerunning this job.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report what would change without writing anything to SkriptHub'
        type: boolean
        default: false

# The repository checkout is read-only; the workflow writes to SkriptHub.
permissions:
  contents: read

# Serialize runs so they do not update the same SkriptHub entries concurrently.
concurrency:
  group: skripthub-docs
  cancel-in-progress: false

jobs:

  publish:
    name: Publish the syntax documentation
    # The environment restricts access to the publishing token to jobs on the default branch.
    environment: skripthub
    # Publish after a successful release, or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pass the token through the environment, not a command-line argument.
      SKRIPTHUB_TOKEN: ${{ secrets.SKRIPTHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # Use the released commit, or the selected ref for a manual run.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: ./.github/actions/prepare-build

      # Report a missing token before making any API requests.
      - name: Check the token
        run: |
          if [ -z "$SKRIPTHUB_TOKEN" ]; then
            echo "::error::the environment secret SKRIPTHUB_TOKEN is not set. Create an environment named 'skripthub' whose deployment branch rule is the default branch, add the token from the SkriptHub API documentation page to its Environment secrets, and run this again."
            exit 1
          fi

      # Boot a disposable Paper server to generate and validate JSON from the syntax annotations.
      - name: Generate the documentation
        run: ./gradlew gendocs --stacktrace

      # Keep the JSON for review and for importing examples in the dashboard.
      - name: Upload the generated JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: skripthub-docs
          path: build/skripthub/skript-orm.json
          if-no-files-found: ignore

      # The script records successful and failed updates in the run summary.
      - name: Publish to SkriptHub
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            node scripts/publish-skripthub.mjs --dry-run
          else
            node scripts/publish-skripthub.mjs
          fi
