name: Wiki

# Publish both languages to the separate wiki repository, with Chinese first.
# Chinese pages keep their existing names; English pages add `-EN`. Edit the source files here,
# not the generated wiki pages.
#
# Watch documentation and publishing files explicitly. Publish only from master or a manual run,
# never from pull requests.
on:
  push:
    branches:
      - 'master'
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/publish-wiki.ps1'
      - 'scripts/wiki-pages.tsv'
      - 'scripts/wiki-sidebar.md'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

# Allow the workflow token to push changes to the wiki.
permissions:
  contents: write

# Run one publication at a time to avoid conflicting pushes. Let an active run finish.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:

  publish:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Create an initial page in GitHub's wiki interface before the first run.
      # This initializes the wiki repository; the generated pages replace it on publication.
      - name: Check out the wiki
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Render the pages
        shell: pwsh
        run: ./scripts/publish-wiki.ps1 -WikiDirectory wiki

      - name: Push what changed
        working-directory: wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The wiki already matches the documentation."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message "docs: sync bilingual wiki from ${GITHUB_SHA:0:7}"
          git push
