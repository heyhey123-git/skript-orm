name: Wiki

# Publish both languages to the wiki repository. Chinese pages retain their names; English
# pages use an `-EN` suffix. Edit the source documentation in this repository.
#
# Publish on documentation changes to master or on manual dispatch.
on:
  push:
    branches:
      - 'master'
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'scripts/publish-wiki.ps1'
      - 'scripts/wiki-pages.tsv'
      - 'scripts/wiki-sidebar.md'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

# Allow the workflow token to push changes to the wiki.
permissions:
  contents: write

# Serialize publication to avoid conflicting wiki pushes.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:

  publish:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # GitHub requires an initial wiki page before its repository can be checked out.
      - name: Check out the wiki
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Render the pages
        shell: pwsh
        run: ./scripts/publish-wiki.ps1 -WikiDirectory wiki

      - name: Push what changed
        working-directory: wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The wiki already matches the documentation."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message "docs: sync bilingual wiki from ${GITHUB_SHA:0:7}"
          git push
