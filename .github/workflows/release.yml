name: Release

# Run manually from the default branch. The release tag points to the commit built and tested here.
#
# Release notes come from the CHANGELOG.md section for the version in gradle.properties.
# Editing the notes of a release that is already published is `./gradlew releaseNotes` followed by
# `gh release edit v<version> --notes-file build/release-notes.md`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release:
    name: Build, verify and publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build

      # Release the committed version and reject development snapshots.
      - name: Read and check the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::gradle.properties declares no version."
            exit 1
          fi
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::gradle.properties still says '$version'. Set the release version (for example 1.0.0), push that, and run this again."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain release version such as 1.0.0."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::release v$version already exists."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists."
            exit 1
          fi
          # Check for release notes before starting the build.
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Write what this release changes first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Verify the release jar with unit, Skript integration, and Paper server tests. Database
      # integration tests run separately in ci.yml, where their servers are available.
      - name: Build and verify
        run: ./gradlew clean test :core:integrationTest serverTest --stacktrace

      - name: Check the jar agrees with the version
        run: |
          jar="build/dist/skriptorm-${{ steps.version.outputs.version }}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::no $jar was produced, so the jar and gradle.properties disagree."
            ls -l build/dist
            exit 1
          fi
          sha256sum "$jar" | tee "$jar.sha256"

      # Extract the release body from CHANGELOG.md with the shared releaseNotes task.
      - name: Write the release notes
        run: ./gradlew releaseNotes --stacktrace

      - name: Publish the release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/dist/skriptorm-${{ steps.version.outputs.version }}.jar" \
            "build/dist/skriptorm-${{ steps.version.outputs.version }}.jar.sha256" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md

      - name: Summarize
        run: |
          {
            echo "### Released v${{ steps.version.outputs.version }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Jar | \`skriptorm-${{ steps.version.outputs.version }}.jar\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ steps.version.outputs.version }} |"
          } >> "$GITHUB_STEP_SUMMARY"
