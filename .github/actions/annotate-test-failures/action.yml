name: Annotate failing tests
description: >-
  Reports JUnit XML failures as check annotations so failures are visible without downloading
  the full job log.

runs:
  using: composite
  steps:
    - name: Annotate
      shell: bash
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET


        def escape(text):
            return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')


        reported = 0
        for path in sorted(glob.glob('**/build/test-results/*/TEST-*.xml', recursive=True)):
            for suite in ET.parse(path).getroot().iter('testsuite'):
                owner = suite.get('name', '').split('.')[-1]
                for case in suite.iter('testcase'):
                    for failure in case.iter('failure'):
                        detail = failure.get('message') or failure.get('type') or 'failed'
                        detail = ' '.join(detail.split())[:800]
                        print('::error::' + escape(f"{owner}.{case.get('name')} - {detail}"))
                        reported += 1

        print(f'annotated {reported} failing test(s)')
        PY
