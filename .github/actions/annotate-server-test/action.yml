name: Annotate the server test
description: >-
  Reports Skript server test failures as check annotations. Uses the harness's problem list when
  available and falls back to the server log otherwise.

runs:
  using: composite
  steps:
    - name: Annotate
      shell: bash
      run: |
        problems=build/server-test/logs/test-problems.txt
        if [ -f "$problems" ]; then
          # Use the explicit problem list when the harness produced one.
          while IFS= read -r line; do
            echo "::error::$line"
          done < "$problems"
          exit 0
        fi
        # Fall back to the server log if the harness stopped before writing a problem list.
        log=build/server-test/logs/latest.log
        if [ -f "$log" ]; then
          grep -E 'SKRIPTORM_SELFTEST|\[Skript\] Line|Exception|ERROR' "$log" | tail -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
        fi
