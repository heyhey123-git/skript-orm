name: Prepare the build
description: >-
  Sets up JDK 25, Gradle, and the shared Gradle User Home cache for CI jobs.

  Workflows must check out the repository before calling this local action.

inputs:
  gradle-cache-read-only:
    description: >-
      Restores the Gradle cache without updating it.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    # Cache the wrapper, dependencies, and generated API jars in Gradle User Home.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: enhanced
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    # Restore the executable bit lost when the wrapper is committed from Windows.
    - name: Make the wrapper executable
      shell: bash
      run: chmod +x ./gradlew
